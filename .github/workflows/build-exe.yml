name: Build EXE

on:
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build EXE
        run: python -m PyInstaller --clean --noconfirm tglite.spec

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TGLite-Windows
          path: dist/TGLite.exe
